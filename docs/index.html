<style>
  body {
    color: var(--color-accent);
    font-family: var(--font-sans);
    font-size: var(--size-small);
    line-height: var(--leading-compact);
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 1.5rem) 1.25rem calc(env(safe-area-inset-bottom, 0px) + 2rem);
  }

  h1 {
    font-size: var(--size-large);
    margin: 0 0 1.4rem;
  }
  .section-label {
    font-size: 0.78em;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-muted);
    margin: 0 0 0.75rem;
  }
  .starred-section { margin-bottom: 2rem; }
  .starred-section[hidden] { display: none; }

.icon-btn[aria-label="Home"] {
	display: none;
}

  /* ---------- Icon grid ---------- */

  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 0.5rem;
  }

  .tile { position: relative; }

  .tile-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.45rem;
    width: 100%;
    padding: 0.65rem 0.3rem 0.5rem;
    border: none;
    background: none;
    text-decoration: none;
    color: var(--color-accent);
    font-family: inherit;
    font-size: 1em;
    border-radius: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tile-link:hover,
  .tile-link:focus-visible {
    background: rgba(0, 0, 0, 0.045);
  }
  .tile-link:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .tile-icon {
    position: relative;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: rgba(47, 90, 95, 0.08);
    color: var(--color-accent);
    flex-shrink: 0;
  }
  .tile-icon svg { width: 24px; height: 24px; }

  .folder-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 14px;
    height: 14px;
    background: var(--color-accent);
    border: 2px solid var(--color-bg);
    border-radius: 50%;
  }

  .tile-label {
    font-size: 0.78em;
    line-height: 1.2;
    text-align: center;
    overflow-wrap: break-word;
    max-width: 100%;
  }

  .star-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 26px;
    height: 26px;
    padding: 0;
    border: none;
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-muted);
    opacity: 0.5;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .star-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  .star-btn:hover, .star-btn:focus-visible { opacity: 1; }
  .star-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; border-radius: 50%; }
  .star-btn[aria-pressed="true"] { color: var(--color-star); opacity: 1; }
  .star-btn[aria-pressed="true"] svg { fill: currentColor; }

  /* ---------- Folder sheet ---------- */

  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: var(--color-overlay);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 30;
  }
  html[data-sheet-open="true"] .sheet-overlay { opacity: 1; pointer-events: auto; }

  .folder-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 720px;
    margin: 0 auto;
    max-height: 80vh;
    background: var(--color-bg);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -2px 24px rgba(0, 0, 0, 0.15);
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 31;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html[data-sheet-open="true"] .folder-sheet { transform: translateY(0); }

  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.25rem 1rem;
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }
.sheet-header h2 {
	margin: 0;
	font-size: 1.05em;
}
  .sheet-close {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: none;
    color: var(--color-accent);
    opacity: 0.6;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sheet-close svg { width: 18px; height: 18px; }
  .sheet-close:hover, .sheet-close:focus-visible { opacity: 1; background: rgba(0,0,0,0.06); }
  .sheet-close:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .sheet-body { overflow-y: auto; padding: 1.25rem; }

  @media (prefers-reduced-motion: reduce) {
    .folder-sheet, .sheet-overlay { transition: none !important; }
  }
</style>

  var STAR_KEY = 'refDocStarred';

  var STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12.0 2.0 L14.53 8.52 L21.51 8.91 L16.09 13.33 L17.88 20.09 L12.0 16.3 L6.12 20.09 L7.91 13.33 L2.49 8.91 L9.47 8.52 Z"/></svg>';

  // ---------------------------------------------------------------
  // Starred state (localStorage) — a flat array of item ids
  // ---------------------------------------------------------------
  function loadStarred() {
    try { return JSON.parse(localStorage.getItem(STAR_KEY)) || []; } catch (e) { return []; }
  }
  function saveStarred() {
    try { localStorage.setItem(STAR_KEY, JSON.stringify(starred)); } catch (e) {}
  }
  var starred = loadStarred();

  function toggleStar(id) {
    var idx = starred.indexOf(id);
    if (idx === -1) starred.push(id); else starred.splice(idx, 1);
    saveStarred();
    renderAll();
    // Re-rendering replaces DOM nodes, which drops focus — put it back on
    // the equivalent star button so keyboard/screen-reader users don't
    // lose their place.
    var toRefocus = document.querySelector('.star-btn[data-id="' + id + '"]');
    if (toRefocus) toRefocus.focus();
  }

  // Flat lookup of every direct-link item (top-level and nested), by id —
  // this is what makes the starred section work regardless of where a
  // starred link actually lives.
  var allLinks = {};
  NAV_ITEMS.forEach(function (item) {
    if (item.href) allLinks[item.id] = item;
    if (item.children) item.children.forEach(function (c) { allLinks[c.id] = c; });
  });

  // ---------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------
  function makeTile(item, opts) {
    opts = opts || {};
    var tile = document.createElement('div');
    tile.className = 'tile ' + item.presider;

    if (item.children) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tile-link';
      btn.setAttribute('aria-haspopup', 'dialog');
      btn.innerHTML =
        '<span class="tile-icon">' + (ICONS[item.icon] || ICONS.folder) + '<span class="folder-badge" aria-hidden="true"></span></span>' +
        '<span class="tile-label">' + item.label + '</span>';
      btn.addEventListener('click', function () { openFolder(item); });
      tile.appendChild(btn);
    } else {
      var a = document.createElement('a');
      a.className = 'tile-link';
      a.href = item.href;
      a.innerHTML =
        '<span class="tile-icon">' + (ICONS[item.icon] || ICONS.document) + '</span>' +
        '<span class="tile-label">' + item.label + '</span>';
      tile.appendChild(a);

      var isOn = starred.indexOf(item.id) !== -1;
      var star = document.createElement('button');
      star.type = 'button';
      star.className = 'star-btn';
      star.setAttribute('data-id', item.id);
      star.setAttribute('aria-pressed', isOn ? 'true' : 'false');
      star.setAttribute('aria-label', (isOn ? 'Unstar ' : 'Star ') + item.label);
      star.innerHTML = STAR_SVG;
      star.addEventListener('click', function (e) {
        e.preventDefault(); // the tile behind it is a link; don't navigate
        toggleStar(item.id);
      });
      tile.appendChild(star);
    }
    return tile;
  }

  function renderGrid(container, items, opts) {
    container.innerHTML = '';
    items.forEach(function (item) { container.appendChild(makeTile(item, opts)); });
  }

  var currentFolder = null; // the folder object currently shown in the sheet, if any

  function renderAll() {
    var starredItems = starred.map(function (id) { return allLinks[id]; }).filter(Boolean);
    var starredSection = document.getElementById('starredSection');
    if (starredItems.length) {
      renderGrid(document.getElementById('starredGrid'), starredItems);
      starredSection.hidden = false;
    } else {
      starredSection.hidden = true;
    }
    renderGrid(document.getElementById('mainGrid'), NAV_ITEMS);
    if (currentFolder) renderGrid(document.getElementById('folderGrid'), currentFolder.children);
  }

  // ---------------------------------------------------------------
  // Folder sheet — same inert/scroll-lock pattern as the reference
  // document template's settings drawer.
  // ---------------------------------------------------------------
  var root = document.documentElement;
  var pageMain = document.getElementById('pageMain');
  var sheet = document.getElementById('folderSheet');
  var sheetOverlay = document.getElementById('sheetOverlay');
  var sheetTitle = document.getElementById('sheetTitle');
  var sheetClose = document.getElementById('sheetClose');
  var scrollY = 0;

  function lockScroll() {
    scrollY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = -scrollY + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
  }
  function unlockScroll() {
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    window.scrollTo(0, scrollY);
  }

  function openFolder(item) {
    currentFolder = item;
    sheetTitle.textContent = item.label;
    renderGrid(document.getElementById('folderGrid'), item.children);
    lockScroll();
    root.setAttribute('data-sheet-open', 'true');
    sheet.removeAttribute('inert');
    pageMain.setAttribute('inert', '');
    sheetClose.focus();
    document.addEventListener('keydown', onSheetKeydown);
  }
  function closeSheet() {
    currentFolder = null;
    root.removeAttribute('data-sheet-open');
    sheet.setAttribute('inert', '');
    pageMain.removeAttribute('inert');
    unlockScroll();
    document.removeEventListener('keydown', onSheetKeydown);
  }
  function onSheetKeydown(e) {
    if (e.key === 'Escape') closeSheet();
  }

  sheetClose.addEventListener('click', closeSheet);
  sheetOverlay.addEventListener('click', closeSheet); // browsing, not a required choice — backdrop-dismiss is fine here

  renderAll();
})();
</script>
